name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Cache OpenTofu and providers
        uses: actions/cache@v4
        with:
          path: ~/.cache/easymigrate
          key: easymigrate-tofu-${{ runner.os }}
      - name: Test (tofu validate)
        run: uv run pytest -m tofu
