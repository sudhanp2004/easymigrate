[project]
name = "easymigrate"
version = "0.1.0"
description = "Migrate cloud infrastructure from AWS to GCP through an intent-level IR."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "google-cloud-storage>=2.16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]
# The hosted report (easymigrate.sudhan.tech); see deploy/README.md.
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
]

[project.scripts]
easymigrate = "easymigrate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easymigrate"]
# The built frontend (src/easymigrate/ui/static/) is committed but, being build output,
# would otherwise be an easy thing for a future .gitignore or a build-artifact filter
# to exclude; `artifacts` guarantees it ships even though hatch treats it like
# generated output (spec §6/§7, plan 4).
artifacts = ["src/easymigrate/ui/static/**"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[ec2,resourcegroupstaggingapi,sts]>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -m 'not tofu'"
pythonpath = ["."]
markers = [
    "tofu: needs network access to download OpenTofu/providers and run `tofu validate`; excluded from the default run, opt in with `-m tofu`.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototype", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
